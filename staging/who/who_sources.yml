version: 2

sources:
  - name: who_news
    description: Raw WHO news data stored in the local SQLite database.
    schema: who_news
    tables:
      - name: articles
      - name: ingestion_audit
        description: Ingestion-run audit records stored beside the raw WHO news.

  - name: campaign_news
    description: Raw WHO campaign data stored in the local SQLite database.
    schema: campaign_news
    tables:
      - name: articles
        identifier: campaigns
      - name: ingestion_audit
        description: Ingestion-run audit records stored beside raw WHO campaigns.

  - name: commentary_news
    description: Raw WHO commentary data stored in the local SQLite database.
    schema: commentary_news
    tables:
      - name: articles
        identifier: commentaries
      - name: ingestion_audit
        description: Ingestion-run audit records stored beside raw WHO commentaries.

  - name: event_news
    description: Raw WHO event data stored in the local SQLite database.
    schema: event_news
    tables:
      - name: articles
        identifier: events
      - name: ingestion_audit
        description: Ingestion-run audit records stored beside raw WHO events.

  - name: speech_news
    description: Raw WHO speech data stored in the local SQLite database.
    schema: speech_news
    tables:
      - name: articles
        identifier: speeches
      - name: ingestion_audit
        description: Ingestion-run audit records stored beside raw WHO speeches.

  - name: statement_news
    description: Raw WHO statement data stored in the local SQLite database.
    schema: statement_news
    tables:
      - name: articles
        identifier: statements
      - name: ingestion_audit
        description: Ingestion-run audit records stored beside raw WHO statements.

  - name: stories_news
    description: Raw WHO feature-story data stored in the local SQLite database.
    schema: stories_news
    tables:
      - name: articles
        identifier: feature_stories
      - name: ingestion_audit
        description: Ingestion-run audit records stored beside raw WHO feature stories.
