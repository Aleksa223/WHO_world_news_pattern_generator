version: 2

models:
  - name: mart_news_monthly_summary
    description: Monthly WHO news publication totals grouped by normalized news type.
    columns:
      - name: published_year
        description: Calendar year in which the articles were published.
        data_tests:
          - not_null
      - name: published_month
        description: Calendar month number in which the articles were published.
        data_tests:
          - not_null
      - name: normalized_news_type
        description: Lowercase, trimmed WHO news type.
        data_tests:
          - not_null
      - name: article_count
        description: Number of articles in the month and news-type group.
