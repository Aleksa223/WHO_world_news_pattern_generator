name: Daily News Pipeline

"on":
  schedule:
    # GitHub schedules use UTC. Minute 17 avoids the busiest top-of-hour window.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      reset_state:
        description: Ignore earlier cloud state and start with empty databases
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: daily-news-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RESTORED_STATE_DIRECTORY: ${{ runner.temp }}/restored-raw-sqlite-state
      PUBLISHED_STATE_DIRECTORY: ${{ runner.temp }}/published-raw-sqlite-state

    steps:
      - name: Check out the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Restore the latest successful raw database state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RESET_STATE: ${{ inputs.reset_state || false }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "This workflow must run from the default branch (${DEFAULT_BRANCH})." >&2
            exit 1
          fi

          if [[ "${RESET_STATE}" == "true" ]]; then
            echo "reset_state is enabled; starting with fresh cloud databases."
            exit 0
          fi

          latest_run_id="$(
            gh run list \
              --workflow daily-news.yml \
              --branch "${DEFAULT_BRANCH}" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"

          if [[ -z "${latest_run_id}" ]]; then
            echo "No earlier successful run exists; bootstrapping fresh databases."
            exit 0
          fi

          artifact_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${latest_run_id}/artifacts" \
              --jq '.artifacts[] | select(.name == "raw-sqlite-state") | .id'
          )"

          if [[ -z "${artifact_id}" ]]; then
            echo "The latest successful run has no raw-state artifact." >&2
            echo "Run this workflow manually with reset_state enabled to start fresh." >&2
            exit 1
          fi

          mkdir -p "${RESTORED_STATE_DIRECTORY}"
          gh run download "${latest_run_id}" \
            --name raw-sqlite-state \
            --dir "${RESTORED_STATE_DIRECTORY}"
          python3 maintenance_scripts/pipeline_state.py restore \
            --project-root . \
            --snapshot-directory "${RESTORED_STATE_DIRECTORY}"

      - name: Build the Airflow image
        run: docker compose build airflow

      - name: Initialize ephemeral Airflow metadata
        shell: bash
        run: |
          docker compose run --rm --no-deps \
            --user "$(id -u):0" \
            airflow airflow db migrate

      - name: Execute the complete Airflow DAG once
        shell: bash
        run: |
          docker compose run --rm --no-deps \
            --user "$(id -u):0" \
            airflow airflow dags test who_news_pipeline

      - name: Create a validated raw database snapshot
        run: |
          python3 maintenance_scripts/pipeline_state.py create \
            --project-root . \
            --snapshot-directory "${PUBLISHED_STATE_DIRECTORY}" \
            --source-commit "${GITHUB_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}"

      - name: Verify every published pipeline output exists
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("dags").resolve()))
          from news_pipeline_config import ALL_FETCH_JOBS

          expected = [Path("warehouse/analytics.db")]
          expected.extend(Path(job.output) for job in ALL_FETCH_JOBS)
          missing = [path.as_posix() for path in expected if not path.is_file()]
          if missing:
              raise SystemExit("Missing pipeline outputs: " + ", ".join(missing))
          PY

      - name: Upload analytics database and latest-run JSON
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: news-analytics-${{ github.run_id }}
          path: |
            warehouse/analytics.db
            articles/who_latest_news.json
            articles/who_latest_campaigns.json
            articles/who_latest_commentaries.json
            articles/who_latest_events.json
            articles/who_latest_speeches.json
            articles/who_latest_statements.json
            articles/who_latest_feature_stories.json
            tech_articles/tech_news.json
            economic_articles/economic_news.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Save raw database state for the next scheduled run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raw-sqlite-state
          path: ${{ env.PUBLISHED_STATE_DIRECTORY }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Remove ephemeral Airflow containers and volumes
        if: always()
        continue-on-error: true
        run: docker compose down --volumes --remove-orphans
