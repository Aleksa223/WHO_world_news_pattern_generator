version: 2

models:
  - name: tech_int_title_topics
    description: >
      Significant lowercase words extracted from Hacker News story titles.
      The grain is one story and one distinct literal word; topic contains a
      conservative canonical word-family label for grouped analysis.
    columns:
      - name: word_key
        description: Unique identifier composed of story ID and literal title word.
        data_tests:
          - not_null
          - unique
      - name: article_id
        description: Hacker News story ID exposed with the common title-analysis name.
        data_tests:
          - not_null
      - name: story_id
        description: Hacker News story ID.
        data_tests:
          - not_null
      - name: observation_date
        description: Story publication date, falling back to first ingestion date.
        data_tests:
          - not_null
      - name: title
        description: Full Hacker News story title.
        data_tests:
          - not_null
      - name: normalized_title
        description: Lowercase trimmed title used for distinct-title metrics.
        data_tests:
          - not_null
      - name: title_word
        description: Literal lowercase alphanumeric word extracted from the title.
        data_tests:
          - not_null
      - name: topic
        description: Canonical word-family label; equals title_word when no mapping applies.
        data_tests:
          - not_null
      - name: canonical_topic
        description: Explicit alias of topic used by grouped title analysis.
        data_tests:
          - not_null
      - name: is_mapped
        description: One when the literal word has an explicit topic-map row, otherwise zero.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: source
        description: Domain associated with the Hacker News story.
        data_tests:
          - not_null
      - name: category
        description: Normalized project content category.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [tech]
